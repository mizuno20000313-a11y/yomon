<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YOMON。</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#171717;font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.head,.wrap{width:min(1100px,92vw);margin:auto}header{position:sticky;top:0;background:#f6f2e9ef;border-bottom:1px solid;z-index:9}.head{height:66px;display:flex;align-items:center;justify-content:space-between}.logo{font:900 36px Georgia}.logo i{font-style:normal;color:#e55346}nav{display:flex;gap:14px;font-size:11px;font-weight:900}.hero,.section{padding:7vh 0}.hero h1,.section h2{font-family:'Yu Mincho',serif;letter-spacing:-.05em}.hero h1{font-size:clamp(48px,8vw,96px);line-height:1.05}.hero p{font-size:20px;max-width:720px}.searchbox{display:flex;gap:8px;margin:25px 0}.searchbox input{flex:1;padding:14px;border:1px solid;background:#fff}.searchbox button,.btn{background:#111;color:#fff;border:0;padding:13px 16px;font-weight:900}.moods,.tags{display:flex;gap:7px;flex-wrap:wrap}.mood,.tag{border:1px solid;background:#fff;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900}.section{border-top:1px solid}.section h2{font-size:clamp(34px,5vw,58px)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid;background:#fffdf8;padding:22px}.card h3,.row h3{font-family:'Yu Mincho',serif}.card h3{font-size:24px}.row{display:grid;grid-template-columns:80px 1fr auto;gap:15px;align-items:center;border-top:1px solid;padding:18px 0}.row p{margin:2px 0;color:#756e65;font-size:12px}.type{font-size:10px;font-weight:900}.empty{padding:35px;border:1px dashed;text-align:center;color:#756e65}.cover{width:min(1120px,92vw);margin:4vh auto 0;min-height:560px;background:linear-gradient(135deg,#bed1cf,#e9c79f 55%,#687985);border:1px solid;position:relative}.covertext{position:absolute;left:4%;bottom:6%;background:#fffdf8ee;padding:22px;width:min(720px,85%)}.covertext h1{font-family:'Yu Mincho',serif;font-size:clamp(44px,7vw,78px);line-height:1.05}.article{width:min(820px,90vw);margin:auto}.article p{font-size:17px}.memo{background:#f1df9d;padding:25px;margin:5vh 0}.related{margin:6vh 0}.kicker{font-size:10px;font-weight:900;letter-spacing:.12em}
@media(max-width:720px){.cards{grid-template-columns:1fr}.searchbox{flex-direction:column}.row{grid-template-columns:65px 1fr}.row span:last-child{display:none}}
</style></head><body>
<header><div class="head"><a class="logo" href="./">YOMON<i>。</i></a><nav><a href="記事/検索しなくなる日.html">記事</a><a href="漫画/">漫画</a><a href="研究室/">研究室</a><a href="選択/">選ぶ</a><a href="検索/">🔍 探す</a></nav></div></header>
<main class="wrap">
<section class="hero"><span class="kicker">YOMON。DISCOVERY</span><h1>気になるものを、<br>次々見つける。</h1><p>記事、漫画、実験、商品。YOMON。の中をキーワードや気分から探せます。</p>
<div class="searchbox"><input id="q" placeholder="AI、仕事、デスク、買い物…"><button onclick="go()">検索 →</button></div>
<div class="moods"><button class="mood" onclick="m('AIを使ってみたい')">🤖 AIを使ってみたい</button><button class="mood" onclick="m('仕事をラクにしたい')">💼 仕事をラクにしたい</button><button class="mood" onclick="m('買ってよかったもの')">🛒 買ってよかった</button><button class="mood" onclick="m('3分で読みたい')">📖 3分で読みたい</button></div></section>
<section class="section"><span class="kicker">NEW</span><h2>まず、ここから。</h2><div class="cards" id="cards"></div></section>
<section class="section"><span class="kicker">FOR YOU</span><h2>この辺、好きかも。</h2><div id="foryou"></div></section>
</main>
<script src="データ/content-data.js"></script><script>
const D=window.YOMON_CONTENT||[];
function go(){location.href='検索/?q='+encodeURIComponent(document.getElementById('q').value)}
function m(x){location.href='検索/?mood='+encodeURIComponent(x)}
document.getElementById('cards').innerHTML=D.slice(0,3).map(x=>`<a class="card" href="${x.url.replace('../','')}"><span class="type">${x.type}</span><h3>${x.title}</h3><p>${x.description}</p><div class="tags">${x.tags.slice(0,3).map(t=>`<span class="tag">#${t}</span>`).join('')}</div></a>`).join('');
document.getElementById('foryou').innerHTML=D.slice(1,4).map(x=>`<a class="row" href="${x.url.replace('../','')}"><span class="type">${x.type}</span><div><h3>${x.title}</h3><p>${x.description}</p></div><span>→</span></a>`).join('');
</script></body></html>
